<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosy Teacher 500 雲端試聽索引</title>
  <style>
    :root {
      --bg: #f5f2ec;
      --paper: #fffefa;
      --ink: #24211d;
      --muted: #6b6258;
      --line: #d9d0c4;
      --blue: #255f7f;
      --red: #b23b38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 14px 56px;
    }
    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
    }
    h1 {
      margin: 6px 0 10px;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }
    p { color: var(--muted); margin: 8px 0; }
    .links {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    a {
      display: block;
      text-decoration: none;
      background: var(--blue);
      color: white;
      border-radius: 8px;
      padding: 14px 16px;
      font-weight: 800;
    }
    .note {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Cloud audio review</div>
    <h1>Cosy Teacher 500 句雲端試聽</h1>
    <p>每頁 100 句，音檔已壓成 48kbps AAC 並嵌入 HTML。離開家裡 Wi-Fi 也能聽。</p>
    <div class="links">
      <a href="https://drive.google.com/file/d/1ZbutXaDKJqNun0c9d122qtGrlsq1m3Up/view?usp=drivesdk">Part 01 · 001-100</a>
      <a href="https://drive.google.com/file/d/1KNbyRAHn9I6DKd1yDKovgr0lBcZAw5RB/view?usp=drivesdk">Part 02 · 101-200</a>
      <a href="https://drive.google.com/file/d/1OvXhB9tbLJy2GSviI4asoeX9D6TlJeLJ/view?usp=drivesdk">Part 03 · 201-300</a>
      <a href="https://drive.google.com/file/d/15bH_eYmXnrQRj3VeT-HfK7EE_fIriBtv/view?usp=drivesdk">Part 04 · 301-400</a>
      <a href="https://drive.google.com/file/d/1TqryA4Rjg4z4OnWX8rm8dnnVqvu8N7m6/view?usp=drivesdk">Part 05 · 401-500</a>
    </div>
    <div class="note">
      <p>這是外出挑選用的壓縮試聽版。真正訓練還是使用本機原始 wav，不會用這些壓縮檔訓練。</p>
    </div>
  </main>
</body>
</html>
