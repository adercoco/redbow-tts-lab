<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZipVoice 手機 TTS Demo</title>
  <style>
    :root {
      --bg: #f7f3ed;
      --paper: #fffdfa;
      --ink: #171514;
      --muted: #665e57;
      --line: #ded7ce;
      --red: #a52232;
      --green: #177245;
      --soft: #efe7dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 18px 14px 48px;
    }
    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin: 8px 0 12px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
    }
    textarea {
      width: 100%;
      min-height: 122px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      font-size: 17px;
      line-height: 1.55;
      background: white;
      color: var(--ink);
    }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: var(--red);
      color: white;
      font: inherit;
      font-weight: 800;
      font-size: 17px;
      margin-top: 10px;
    }
    button:disabled {
      opacity: .62;
    }
    .examples {
      display: grid;
      gap: 8px;
    }
    .example {
      text-align: left;
      background: var(--soft);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 650;
      font-size: 15px;
      min-height: 44px;
      margin: 0;
      padding: 9px 10px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .metric {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .metric b {
      display: block;
      font-size: 19px;
      line-height: 1.1;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
    }
    audio {
      width: 100%;
      height: 44px;
      margin-top: 10px;
    }
    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }
    .ok { color: var(--green); font-weight: 750; }
    .err { color: var(--red); font-weight: 750; }
    a {
      color: var(--red);
      text-decoration: none;
      font-weight: 750;
    }
    code {
      background: #eee8df;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ZipVoice int8 · 手機生成 demo</div>
    <h1>台灣溫柔女生 TTS</h1>
    <p>在手機上輸入文字，送到這台 Mac 的 ZipVoice server 生成，回傳後直接播放。</p>

    <section class="card">
      <textarea id="text">欸，你先不要急啦，我有在聽，我們一步一步確認就好。</textarea>
      <button id="generate">生成並播放</button>
      <div id="status" class="status">模型：ZipVoice int8 + seed_0001 teacher reference</div>
      <audio id="audio" controls></audio>
      <div class="meta">
        <div class="metric"><b id="genTime">-</b><span>生成時間</span></div>
        <div class="metric"><b id="duration">-</b><span>音訊長度</span></div>
      </div>
    </section>

    <section class="card">
      <p><b>範例句</b></p>
      <div class="examples">
        <button class="example" data-text="欸，你先不要急啦，我有在聽，我們一步一步確認就好。">安撫型：你先不要急</button>
        <button class="example" data-text="這個聲音如果要放在手機上，重點是反應要快，聽起來也要像台灣女生。">產品型：手機 TTS</button>
        <button class="example" data-text="如果是我的話，我會先把時間、地點、人物關係全部列出來。">推理型：整理線索</button>
        <button class="example" data-text="沒關係，你慢慢說，我有在聽。不要急，想到哪裡就先講哪裡。">溫柔型：慢慢說</button>
      </div>
    </section>

    <section class="card">
      <p><b>目前限制</b></p>
      <p>這是 server demo，不是模型真的已經跑在手機本機。手機只是前端；生成在 Mac 上完成。下一步才是把同一組 ZipVoice ONNX assets 移植到 iOS/Android runtime。</p>
      <p>三方報告：<a href="/zipvoice_main_report/index.html">老師 / 學生 / 學生原本</a></p>
    </section>
  </main>

  <script>
    const text = document.getElementById("text");
    const button = document.getElementById("generate");
    const statusEl = document.getElementById("status");
    const audio = document.getElementById("audio");
    const genTime = document.getElementById("genTime");
    const duration = document.getElementById("duration");
    let lastUrl = null;

    for (const example of document.querySelectorAll(".example")) {
      example.addEventListener("click", () => {
        text.value = example.dataset.text;
        text.focus();
      });
    }

    button.addEventListener("click", async () => {
      const value = text.value.trim();
      if (!value) {
        statusEl.innerHTML = '<span class="err">請先輸入文字</span>';
        return;
      }

      button.disabled = true;
      statusEl.textContent = "生成中，請等一下...";
      genTime.textContent = "-";
      duration.textContent = "-";

      try {
        const started = performance.now();
        const response = await fetch("/api/tts", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text: value})
        });

        if (!response.ok) {
          let message = await response.text();
          try {
            message = JSON.parse(message).error || message;
          } catch (_) {}
          throw new Error(message);
        }

        const blob = await response.blob();
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        audio.src = lastUrl;
        await audio.play().catch(() => {});

        const wall = (performance.now() - started) / 1000;
        const generated = response.headers.get("X-Generation-Seconds");
        const audioDuration = response.headers.get("X-Audio-Duration-Seconds");
        genTime.textContent = generated ? `${Number(generated).toFixed(2)}s` : `${wall.toFixed(2)}s`;
        duration.textContent = audioDuration ? `${Number(audioDuration).toFixed(2)}s` : "-";
        statusEl.innerHTML = '<span class="ok">完成，可以播放了</span>';
      } catch (error) {
        statusEl.innerHTML = `<span class="err">${error.message}</span>`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
